<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Go-Kart — Sarah Bashandy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --card:#FFFFFF; --ink:#20272B; --ink-soft:#5B6670;
    --accent:#2F6F6B; --accent-soft:#E4EFEE; --border:#E7E4DA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Work Sans', sans-serif; line-height:1.65; }
  a{ color:var(--accent); text-decoration:none; }
  img{ max-width:100%; display:block; }
  h1,h2{ font-family:'Poppins', sans-serif; }
  .wrap{ max-width:820px; margin:0 auto; padding:0 24px; }
  nav{ position:sticky; top:0; z-index:50; background:rgba(250,250,247,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); }
  nav .wrap{ display:flex; align-items:center; height:64px; }
  .back-link{ font-weight:600; font-size:14.5px; color:var(--ink-soft); }
  .back-link:hover{ color:var(--accent); }
  header.proj-hero{ padding:56px 0 40px; border-bottom:1px solid var(--border); }
  .proj-meta{ color:var(--accent); font-weight:600; font-size:14px; margin-bottom:10px; }
  h1{ font-size:clamp(28px,4vw,38px); margin-bottom:14px; }
  section{ padding:40px 0; }
  section p{ color:var(--ink-soft); max-width:70ch; margin-bottom:14px; }
  .photo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; }
  figure img{ border:1px solid var(--border); border-radius:10px; aspect-ratio:4/3; object-fit:cover; width:100%; }
  figcaption{ font-size:13px; color:var(--ink-soft); margin-top:8px; }
  footer{ padding:40px 0 60px; text-align:center; font-size:13px; color:var(--ink-soft); }
  @media (max-width:640px){ .photo-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav><div class="wrap"><a class="back-link" href="index.html">← Back to portfolio</a></div></nav>

<header class="proj-hero">
  <div class="wrap">
    <div class="proj-meta">Add your dates here</div>
    <h1>Electric Go-Kart Build</h1>
    <p>[Add a one-line summary of the build here.]</p>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="photo-grid">
      <figure>
        <!-- images/go-kart.jpg -->
        <img src="images/go-kart.jpg" alt="Electric go-kart">
        <figcaption>Add a caption here.</figcaption>
      </figure>
      <figure>
        <!-- images/go-kart-2.jpg -->
        <img src="images/go-kart-2.jpg" alt="Electric go-kart, second view">
        <figcaption>Add a caption here.</figcaption>
      </figure>
    </div>

    <p style="margin-top:28px;">[Add a paragraph here — what you built, what you designed vs. bought, motor/battery setup, top speed, and anything you're proud of or that gave you trouble.]</p>
  </div>
</section>

<footer><div class="wrap"><a href="index.html">← Back to portfolio</a></div></footer>
</body>
</html>
